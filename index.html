<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TILINA EXE - PEPELAND</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #0d0614;
            color: #fff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contenedor Adaptable */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: pixelated;
        }

        /* UI Estilo Glassmorphism */
        .ui-panel {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(15, 8, 28, 0.75);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 183, 197, 0.3);
            backdrop-filter: blur(10px);
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .ui-panel h1 {
            font-size: 14px;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #a1c4fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .msg-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: #fff;
            border: none;
            padding: 10px 16px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 117, 140, 0.6);
            transition: transform 0.1s ease;
            z-index: 20;
            font-size: 12px;
        }

        .msg-btn:active {
            transform: scale(0.92);
        }

        /* Controles Táctiles Rápidos y Cómodos */
        .touch-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
            z-index: 20;
        }

        .d-pad, .action-pad {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }

        .touch-btn {
            width: 56px;
            height: 56px;
            background: rgba(255, 183, 197, 0.22);
            border: 2px solid rgba(255, 183, 197, 0.6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: #fff;
            backdrop-filter: blur(8px);
            touch-action: manipulation;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .touch-btn:active {
            background: rgba(255, 117, 140, 0.7);
            border-color: #ff758c;
            transform: scale(0.92);
        }

        .controls-hint {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 5, 20, 0.8);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            border: 1px solid rgba(255, 183, 197, 0.3);
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
        }

        @media (max-width: 600px) {
            .controls-hint { display: none; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="ui-panel">
        <h1>TILINA EXE</h1>
        <p>🌸 Flores: <span id="flower-count">0</span></p>
        <p>🎏 Letreros: <span id="sign-count">0</span></p>
    </div>
    
    <button class="msg-btn" onclick="changeLoveMessage()">💌 Cambiar Mensaje</button>

    <div class="touch-controls">
        <div class="d-pad">
            <div class="touch-btn" id="btn-left">◀</div>
            <div class="touch-btn" id="btn-right">▶</div>
        </div>
        <div class="action-pad">
            <div class="touch-btn" id="btn-jump">▲</div>
        </div>
    </div>

    <div class="controls-hint">
        🎮 <b>A/D / Táctil</b>: Mover | <b>W / ▲</b>: Saltar
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const TILE_SIZE = 36;
const WORLD_WIDTH = 2500; // Mundo amplio expandido para scroll
const GROUND_Y = () => canvas.height - 90;

let particles = [];
let cherryBlossoms = [];
let fireflies = [];
let signs = [];
let flowers = [];

// Cámara de seguimiento
let cameraX = 0;

const loveMessagesList = [
    "I love you! <3",
    "Te amo Tilina 💖",
    "Eres mi persona favorita ✨",
    "Siempre juntos 🌸",
    "YA ESTAN LISTAS LAS DE HARINA? 🫓🔥"
];
let currentMsgIndex = 0;

const player = {
    x: 150,
    y: 100,
    width: 26,
    height: 40,
    vx: 0,
    vy: 0,
    speed: 5,
    jumpPower: -12.5,
    gravity: 0.58,
    grounded: false,
    facing: 'right',
    activeMessage: "",
    trail: []
};

const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function setupTouch(id, code) {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[code] = true; }, {passive: false});
    btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[code] = false; }, {passive: false});
    btn.addEventListener('mousedown', () => keys[code] = true);
    btn.addEventListener('mouseup', () => keys[code] = false);
}

setupTouch('btn-left', 'KeyA');
setupTouch('btn-right', 'KeyD');
setupTouch('btn-jump', 'KeyW');

function changeLoveMessage() {
    currentMsgIndex = (currentMsgIndex + 1) % loveMessagesList.length;
    signs.forEach(s => s.msg = loveMessagesList[currentMsgIndex]);
}

function initWorld() {
    flowers = [];
    signs = [];
    for (let x = 100; x < WORLD_WIDTH - 200; x += 120 + Math.random() * 80) {
        flowers.push({ x: x, y: GROUND_Y() - 16 });
    }
    for (let x = 400; x < WORLD_WIDTH - 300; x += 550) {
        signs.push({ x: x, y: GROUND_Y() - 32, msg: loveMessagesList[0] });
    }
    document.getElementById('flower-count').innerText = flowers.length;
    document.getElementById('sign-count').innerText = signs.length;
}

// Hojas y Luciérnagas
for (let i = 0; i < 35; i++) {
    fireflies.push({
        x: Math.random() * WORLD_WIDTH,
        y: Math.random() * 400,
        size: Math.random() * 2.5 + 1.5,
        alpha: Math.random(),
        speedX: (Math.random() - 0.5) * 0.6,
        speedY: (Math.random() - 0.5) * 0.6,
        pulse: Math.random() * 0.04
    });
}

for (let i = 0; i < 60; i++) {
    cherryBlossoms.push({
        x: Math.random() * WORLD_WIDTH,
        y: Math.random() * 600,
        size: Math.random() * 4 + 3,
        speedY: Math.random() * 0.9 + 0.4,
        speedX: Math.random() * 1.2 - 0.2,
        angle: Math.random() * Math.PI * 2,
        rotationSpeed: (Math.random() - 0.5) * 0.05
    });
}

function update() {
    if (keys['KeyA'] || keys['ArrowLeft']) {
        player.vx = -player.speed;
        player.facing = 'left';
    } else if (keys['KeyD'] || keys['ArrowRight']) {
        player.vx = player.speed;
        player.facing = 'right';
    } else {
        player.vx *= 0.78;
    }

    if ((keys['KeyW'] || keys['Space'] || keys['ArrowUp']) && player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;

        for (let i = 0; i < 8; i++) {
            particles.push({
                x: player.x + player.width / 2,
                y: player.y + player.height,
                vx: (Math.random() - 0.5) * 4,
                vy: Math.random() * -3,
                life: 20,
                color: '#ff80ab',
                size: Math.random() * 3 + 2
            });
        }
    }

    player.vy += player.gravity;
    player.x += player.vx;
    player.y += player.vy;

    // Colisión suelo y bordes
    if (player.x < 10) player.x = 10;
    if (player.x > WORLD_WIDTH - player.width - 10) player.x = WORLD_WIDTH - player.width - 10;

    const currentGround = GROUND_Y();
    if (player.y + player.height >= currentGround) {
        player.y = currentGround - player.height;
        player.vy = 0;
        player.grounded = true;
    }

    // Cámara con suavizado
    let targetCameraX = player.x - canvas.width / 2 + player.width / 2;
    targetCameraX = Math.max(0, Math.min(targetCameraX, WORLD_WIDTH - canvas.width));
    cameraX += (targetCameraX - cameraX) * 0.1;

    // Rastro
    player.trail.push({ x: player.x, y: player.y, alpha: 0.5 });
    if (player.trail.length > 5) player.trail.shift();

    // Detección de mensajes
    player.activeMessage = "";
    signs.forEach(sign => {
        let dist = Math.abs((player.x + player.width / 2) - (sign.x + 16));
        if (dist < 60) player.activeMessage = sign.msg;
    });
}

function drawHDFlower(x, y) {
    ctx.fillStyle = "#4caf50";
    ctx.fillRect(x + 6, y + 8, 3, 10);
    ctx.fillStyle = "#ff80ab";
    ctx.beginPath();
    ctx.arc(x + 7.5, y + 5, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x + 6, y + 3, 3, 3);
}

function drawHDCat(x, y) {
    ctx.fillStyle = "#78909c";
    ctx.beginPath();
    ctx.roundRect(x, y, 45, 24, 10);
    ctx.fill();
    ctx.fillRect(x + 5, y - 6, 8, 8);
    ctx.fillRect(x + 32, y - 6, 8, 8);
    ctx.fillStyle = "#ff80ab";
    ctx.beginPath();
    ctx.arc(x + 8, y + 10, 3, 0, Math.PI * 2);
    ctx.arc(x + 37, y + 10, 3, 0, Math.PI * 2);
    ctx.fill();
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Fondo Gradiente
    let skyG = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyG.addColorStop(0, '#0d0618');
    skyG.addColorStop(0.6, '#231138');
    skyG.addColorStop(1, '#4a154b');
    ctx.fillStyle = skyG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Luna Fija en pantalla
    ctx.save();
    ctx.shadowBlur = 30;
    ctx.shadowColor = "rgba(255, 200, 225, 0.7)";
    ctx.fillStyle = '#ffe4e1';
    ctx.beginPath();
    ctx.arc(canvas.width - 90, 90, 45, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // APLICAR CÁMARA (DESPLAZAMIENTO)
    ctx.save();
    ctx.translate(-Math.floor(cameraX), 0);

    // Montañas lejanas con Parallax
    ctx.fillStyle = "#1b0b2e";
    ctx.beginPath();
    for (let i = 0; i < WORLD_WIDTH + 500; i += 400) {
        ctx.lineTo(i, GROUND_Y() - 150);
        ctx.lineTo(i + 200, GROUND_Y());
    }
    ctx.lineTo(WORLD_WIDTH + 500, canvas.height);
    ctx.lineTo(0, canvas.height);
    ctx.fill();

    // Suelo
    const gy = GROUND_Y();
    ctx.fillStyle = "#2e7d32";
    ctx.fillRect(0, gy, WORLD_WIDTH, 12);
    ctx.fillStyle = "#1b5e20";
    ctx.fillRect(0, gy + 12, WORLD_WIDTH, canvas.height - gy);

    // Flores y Letreros
    flowers.forEach(f => drawHDFlower(f.x, f.y));

    signs.forEach(s => {
        ctx.fillStyle = "#b71c1c";
        ctx.fillRect(s.x + 4, s.y, 5, 32);
        ctx.fillRect(s.x + 23, s.y, 5, 32);
        ctx.fillStyle = "#7f0000";
        ctx.fillRect(s.x - 2, s.y + 2, 36, 18);
        ctx.strokeStyle = "#ff80ab";
        ctx.strokeRect(s.x - 2, s.y + 2, 36, 18);
        ctx.fillStyle = "#ff80ab";
        ctx.font = "bold 11px sans-serif";
        ctx.fillText("愛", s.x + 12, s.y + 15);
    });

    // Gatito decorativo
    drawHDCat(1200, gy - 24);

    // Rastro del Jugador
    player.trail.forEach((t, i) => {
        ctx.fillStyle = `rgba(255, 128, 171, ${t.alpha * (i / player.trail.length)})`;
        ctx.fillRect(t.x, t.y, player.width, player.height);
    });

    // Jugador
    ctx.save();
    ctx.shadowBlur = 10;
    ctx.shadowColor = "#ff4081";
    ctx.fillStyle = "#1a1a2e";
    ctx.fillRect(player.x, player.y, player.width, player.height);
    ctx.fillStyle = "#00e676";
    let eyeX = player.facing === 'right' ? player.x + 16 : player.x + 4;
    ctx.fillRect(eyeX, player.y + 8, 6, 4);
    ctx.restore();

    // Partículas y Hojas
    fireflies.forEach(f => {
        f.x += f.speedX; f.y += f.speedY;
        ctx.fillStyle = `rgba(255, 238, 88, ${f.alpha})`;
        ctx.fillRect(f.x, f.y, f.size, f.size);
    });

    cherryBlossoms.forEach(p => {
        p.y += p.speedY; p.x += Math.sin(p.angle) * 0.8;
        if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * WORLD_WIDTH; }
        ctx.fillStyle = "rgba(255, 182, 193, 0.85)";
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });

    particles.forEach((p, idx) => {
        p.x += p.vx; p.y += p.vy; p.life--;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        if (p.life <= 0) particles.splice(idx, 1);
    });

    ctx.restore(); // FIN DE TRANSFORMACIÓN DE CÁMARA

    // Cartel del mensaje flotante centrado
    if (player.activeMessage !== "") {
        ctx.save();
        ctx.shadowBlur = 20;
        ctx.shadowColor = "#ff4081";
        ctx.fillStyle = "rgba(20, 10, 30, 0.92)";
        let boxWidth = Math.min(canvas.width - 40, 360);
        let boxX = (canvas.width - boxWidth) / 2;
        ctx.fillRect(boxX, 70, boxWidth, 48);
        ctx.strokeStyle = "#ff4081";
        ctx.lineWidth = 2;
        ctx.strokeRect(boxX, 70, boxWidth, 48);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 15px 'Segoe UI', system-ui";
        ctx.textAlign = "center";
        ctx.fillText(player.activeMessage, canvas.width / 2, 100);
        ctx.restore();
    }
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

initWorld();
gameLoop();
</script>
</body>
</html>
